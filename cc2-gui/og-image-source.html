<!doctype html>
<!-- Source of og-image.png (1200x630 link-preview thumbnail). Re-render with a headless
     Chromium: msedge --headless=new --hide-scrollbars --window-size=1200,630
     --screenshot=og-image.png og-image-source.html
     Colours, tabs and the field follow the live GUI (styles.css): piece colours from the
     [data-piece] rules, the ghost as an outline in its piece colour, amber on the selected
     tab only. -->
<html><head><meta charset="utf-8"><style>
:root{--bg:#0b0b0b;--line:#333833;--line-dim:#222622;--text:#c7ccc7;--muted:#6f766f;--accent:#ffb000;--green:#33d17a}
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:var(--bg);color:var(--text);font-family:Consolas,"MS Gothic",monospace}
.frame{position:absolute;inset:28px;border:1px solid var(--line);display:flex}
.left{flex:1;padding:72px 56px 56px;display:flex;flex-direction:column}
h1{margin:0;font-size:84px;letter-spacing:.06em;font-weight:700}
h1 span{color:var(--green)}
.sub{margin-top:26px;font-size:30px;line-height:1.55;color:var(--text)}
.tabs{margin-top:auto;display:flex;border:1px solid var(--line)}
.tabs div{flex:1;padding:14px 16px;color:var(--muted);font-size:19px;font-weight:700;letter-spacing:.06em;white-space:nowrap}
.tabs div+div{border-left:1px solid var(--line)}
.tabs .on{color:var(--accent);background:#161816}
.right{width:330px;border-left:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.field{display:grid;grid-template-columns:repeat(10,22px);grid-auto-rows:22px;gap:2px;padding:2px;background:#050505;border:1px solid #101010}
.c{position:relative;background:#050505}
.I{background:#23c3d6}.O{background:#d8c02e}.T{background:#a457d6}.L{background:#d8862e}.J{background:#4a6fd8}.S{background:#4fb355}.Z{background:#d1483f}.G{background:#767c76}
.ghost{--edge:#d8862e;opacity:.8;box-shadow:var(--t,0 0 0 transparent),var(--r,0 0 0 transparent),var(--b,0 0 0 transparent),var(--l,0 0 0 transparent)}
.et{--t:inset 0 2px 0 var(--edge)}.er{--r:inset -2px 0 0 var(--edge)}.eb{--b:inset 0 -2px 0 var(--edge)}.el{--l:inset 2px 0 0 var(--edge)}
</style></head><body><div class="frame">
<div class="left"><h1><span>&gt; </span>s2-bot-lab</h1>
<div class="sub">TETR.IO Season 2 再現ルールで<br>Bot vs Bot / 1P vs Bot</div>
<div class="tabs"><div>[ SINGLE ANALYSIS ]</div><div class="on">[ BOT vs BOT / 1P ]</div><div>[ REPLAY ]</div></div></div>
<div class="right"><div class="field" id="f"></div></div></div>
<script>
// 20 rows, top to bottom. "g" marks the ghost (an L), drawn as the GUI draws it
// (styles.css .cell.ghost): each cell rims only its outer edges, so the dark seam
// between cells breaks the outline, at the reduced-motion opacity of .8.
const rows=["..........","..........","..........","..........",
"..........","..........",
"JJJ.Z...OO","JJJZZ...OO","JOOZ....SS","JOOSS.gSSL","ZZSSgggLLL",
"GGGGGGG.GG","GGGGGGG.GG","GGGGGGG.GG",
"GGG.GGGGGG","GGG.GGGGGG","GGG.GGGGGG","GGG.GGGGGG","GGG.GGGGGG","GGG.GGGGGG"];
const ghost=(r,c)=>rows[r]?.[c]==='g';
const f=document.getElementById('f');
rows.forEach((row,r)=>[...row].forEach((ch,c)=>{
  const d=document.createElement('div');d.className='c';
  if(ch==='g'){d.classList.add('ghost');
    if(!ghost(r-1,c))d.classList.add('et');if(!ghost(r,c+1))d.classList.add('er');
    if(!ghost(r+1,c))d.classList.add('eb');if(!ghost(r,c-1))d.classList.add('el');}
  else if(ch!=='.')d.classList.add(ch);
  f.appendChild(d);
}));
</script></body></html>
