[package]
name = "cold-clear-2-chouhy"
version = "0.1.0"
authors = ["MinusKelvin <mark.carlson@minuskelvin.net>"]
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["rlib", "cdylib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ahash = "0.7.4"
bumpalo-herd = "0.1.1"
enum-map = "1.1.1"
enum_dispatch = "0.3.7"
enumset = "1.0.6"
futures = "0.3.15"
nohash = "0.2.0"
once_cell = "1.7.2"
ordered-float = "2.5.0"
ouroboros = "0.13.0"
parking_lot = "0.11.1"
puffin_http = { version = "0.7.0", optional = true }
serde = { version = "1.0.130", features = ["derive"] }
serde_json = "1.0.64"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rand = "0.8.3"
structopt = "0.3.25"
puffin = { version = "0.10.0" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
rand = { version = "0.8.3", default-features = false, features = ["std_rng"] }
puffin-noop = { package = "puffin", path = "../puffin-noop" }

[features]

[patch.crates-io]
instant = { path = "../instant-wasm-safe" }

[dev-dependencies]
criterion = "0.3.5"

[[bench]]
name = "movegen"
harness = false
