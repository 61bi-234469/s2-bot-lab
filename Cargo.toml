[package]
name = "s2-analysis-engine"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Simulator and analysis core for an observed Season 2 ruleset (unofficial, unaffiliated)"

[lib]
# `cdylib` is what `--target wasm32-unknown-unknown` turns into the parity
# artifact; `rlib` keeps the native tests linking against the same crate.
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
pretty_assertions = "1"

